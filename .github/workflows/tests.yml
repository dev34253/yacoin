# Unit and functional tests on every push, except on branches that change
# documentation only (P0-64); coverage and the coverage gate on master, by
# hand, and on branches that change a file the coverage gate watches
# (tasks P0-03, P0-04, P0-63). "[skip ci]" in a commit message skips the
# whole workflow for that push (GitHub feature).
#
# Every job runs contrib/testing/build.sh on a GitHub-hosted runner, which
# runs the build in the pinned build image with Docker – the same command a
# developer runs locally (see contrib/testing/README.md, section "CI").
# Schedules, the self-hosted runner and image mirroring are task P0-44.
name: Tests

on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# "shell: bash" adds -o pipefail to the default -e.
defaults:
  run:
    shell: bash

env:
  # P0-57 image (Ubuntu 24.04, GCC 11), pinned by digest; keep in sync with
  # DEFAULT_IMAGE in contrib/testing/build.sh.
  YACOIN_BUILD_IMAGE: dev34253/yacoin-build@sha256:b7365321bd98ce7297c30bc2eb555f56407548d4cea1836cfbd4b806ba934f7a

jobs:
  # Decides whether the coverage jobs and the gate run (P0-63): always on
  # master and by hand (Run workflow); otherwise when the branch - all its
  # commits since the merge base with master, not only the latest push, so
  # that a newer push cancelling an older run cannot skip the check -
  # changes a watched file: a path of a [[gate]] or [[exclude]] in
  # contrib/testing/coverage-gates.toml, or the gate's own files. On any
  # error it answers "true" (fail safe).
  # It also decides whether the build and test jobs run at all (P0-64):
  # not on a branch whose changes since the merge base are documentation
  # only (*.md, doc/, project/, .claude/); always on master and by hand.
  changes:
    name: changes (coverage needed?)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.docs.outputs.tests }}
      coverage: ${{ steps.decide.outputs.coverage }}
    steps:
      # Full history for the merge base; blob:none skips file contents of
      # older commits (git diff --name-only needs only trees).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Decide whether the build and test jobs run
        id: docs
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          changed="$RUNNER_TEMP/changed-all.txt" code="$RUNNER_TEMP/changed-code.txt"
          echo "### Build and test jobs" >> "$GITHUB_STEP_SUMMARY"
          tests=true
          if [ "$REF" = refs/heads/master ] || [ "$EVENT" = workflow_dispatch ]; then
            say "Run: master or Run workflow."
          elif ! base=$(git merge-base origin/master HEAD); then
            say "Run: no merge base with origin/master (fail safe)."
          elif ! git diff --name-only --no-renames "$base" HEAD > "$changed"; then
            say "Run: git diff against the merge base failed (fail safe)."
          elif [ ! -s "$changed" ]; then
            say "Run: the branch has no changes against master."
          else
            rc=0
            grep -Ev '\.md$|^doc/|^project/|^\.claude/' "$changed" > "$code" || rc=$?
            case $rc in
              0) say "Run: the branch changes files other than documentation, e.g. $(head -n 3 "$code" | paste -sd ' ')" ;;
              1) tests=false
                 say "Skipped: the branch (since merge base ${base:0:10} with master) changes documentation only ($(wc -l < "$changed") files: *.md, doc/, project/, .claude/)." ;;
              *) say "Run: grep failed with exit code $rc (fail safe)." ;;
            esac
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Decide whether the coverage jobs run
        id: decide
        env:
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          watched="$RUNNER_TEMP/watched.txt" changed="$RUNNER_TEMP/changed.txt" hits="$RUNNER_TEMP/hits.txt"
          echo "### Coverage jobs" >> "$GITHUB_STEP_SUMMARY"
          coverage=true
          if [ "$REF" = refs/heads/master ] || [ "$EVENT" = workflow_dispatch ]; then
            say "Run: master or Run workflow."
          elif ! base=$(git merge-base origin/master HEAD); then
            say "Run: no merge base with origin/master (fail safe)."
          elif ! python3 - > "$watched" <<'EOF'
          import tomllib
          with open("contrib/testing/coverage-gates.toml", "rb") as fh:
              cfg = tomllib.load(fh)
          paths = {"contrib/testing/coverage-gates.toml", "contrib/testing/coverage_gate.py",
                   "contrib/testing/test_coverage_gate.py", "contrib/testing/build.sh"}
          paths.update(e["path"] for e in cfg.get("exclude", []))
          paths.update(p for g in cfg.get("gate", []) for p in g.get("paths", []))
          print("\n".join(sorted(paths)))
          EOF
          then
            say "Run: cannot read the watched files from coverage-gates.toml (fail safe; the gate reports the error)."
          elif ! git diff --name-only --no-renames "$base" HEAD > "$changed"; then
            say "Run: git diff against the merge base failed (fail safe)."
          else
            rc=0
            grep -Fx -f "$watched" "$changed" > "$hits" || rc=$?
            echo "merge base $base; $(wc -l < "$changed") files changed on the branch; watched files:"
            sed 's/^/  /' "$watched"
            case $rc in
              0) say "Run: the branch changes watched files: $(paste -sd ' ' "$hits")" ;;
              1) coverage=false
                 say "Skipped: the branch (since merge base ${base:0:10} with master) changes no file the coverage gate watches." ;;
              *) say "Run: grep failed with exit code $rc (fail safe)." ;;
            esac
          fi
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.name }}
    needs: changes
    # Not on documentation-only branches (P0-64).
    if: ${{ needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # The two test jobs run on every push. The two coverage jobs (-O0, about
      # twice as slow) only run where the changes job says so (master, Run
      # workflow, branches changing a watched file), so other task branches
      # get their results sooner.
      matrix:
        include: >-
          ${{ fromJSON(needs.changes.outputs.coverage == 'true' && '[{"name":"unit (mainnet)","id":"mainnet","args":"--config mainnet --unit"},{"name":"unit + functional (lowdiff)","id":"lowdiff","args":"--config lowdiff --unit --functional"},{"name":"coverage (mainnet)","id":"mainnet-cov","args":"--config mainnet --coverage --unit","coverage":"mainnet"},{"name":"coverage (lowdiff)","id":"lowdiff-cov","args":"--config lowdiff --coverage --unit --functional","coverage":"lowdiff"}]' || '[{"name":"unit (mainnet)","id":"mainnet","args":"--config mainnet --unit"},{"name":"unit + functional (lowdiff)","id":"lowdiff","args":"--config lowdiff --unit --functional"}]') }}
    steps:
      - uses: actions/checkout@v4

      # Docker Hub may answer 429 (anonymous pull rate limit): retry.
      - name: Pull build image
        run: |
          for i in 1 2 3 4; do
            docker pull -q "$YACOIN_BUILD_IMAGE" && exit 0
            echo "pull failed (attempt $i), retrying in $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1

      # Downloaded sources and built packages of depends. The depends build
      # itself decides (by its own hashes) what it can reuse, so an older
      # cache from restore-keys is safe.
      - name: Restore depends cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yacoin-build/depends-cache
          key: depends-${{ env.YACOIN_BUILD_IMAGE }}-${{ hashFiles('depends/**') }}
          restore-keys: |
            depends-${{ env.YACOIN_BUILD_IMAGE }}-

      # Compiler cache (P0-65): the newest cache of the same job (same
      # image and matrix id, so coverage builds have their own) from this
      # branch or master. "-sha-" ends the id in the restore prefix:
      # without it "…-mainnet-" would also match the "mainnet-cov" caches. ccache hashes the compiler, flags and headers
      # itself, so an older cache never gives stale objects.
      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/yacoin-ccache
          key: ccache-${{ env.YACOIN_BUILD_IMAGE }}-${{ matrix.id }}-sha-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-${{ env.YACOIN_BUILD_IMAGE }}-${{ matrix.id }}-sha-

      - name: Build and test
        env:
          YACOIN_CCACHE_DIR: ${{ runner.temp }}/yacoin-ccache
          # One -O2 configuration needs about 210 MB (compressed); the
          # limit keeps old objects from piling up in the saved cache.
          YACOIN_CCACHE_MAXSIZE: 1G
        run: |
          contrib/testing/build.sh ${{ matrix.args }} --work-dir "$RUNNER_TEMP/yacoin-build"

      # Hit rate of this build (written by build.sh after make); "built"
      # tells the save step that make finished.
      - name: Compiler cache summary
        id: ccache
        if: ${{ always() }}
        run: |
          built=false
          for f in "$RUNNER_TEMP"/yacoin-build/build-*/ccache-summary.txt; do
            if [ -f "$f" ]; then
              built=true
              { echo "### Compiler cache"; cat "$f"; } | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo "built=$built" >> "$GITHUB_OUTPUT"

      # Saved also when tests failed (the objects are still good), but only
      # when make finished, so an aborted build does not replace a full cache.
      - name: Save compiler cache
        if: ${{ always() && !cancelled() && steps.ccache.outputs.built == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/yacoin-ccache
          key: ccache-${{ env.YACOIN_BUILD_IMAGE }}-${{ matrix.id }}-sha-${{ github.sha }}-${{ github.run_attempt }}

      - name: Coverage summary
        if: ${{ always() && matrix.coverage }}
        run: |
          f="$RUNNER_TEMP/yacoin-build/build-${{ matrix.coverage }}-cov/coverage/summary.txt"
          if [ -f "$f" ]; then
            { echo "### Coverage (${{ matrix.coverage }})"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage
        if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.coverage }}
          path: |
            ${{ runner.temp }}/yacoin-build/build-${{ matrix.coverage }}-cov/coverage/coverage.info
            ${{ runner.temp }}/yacoin-build/build-${{ matrix.coverage }}-cov/coverage/summary.txt
            ${{ runner.temp }}/yacoin-build/build-${{ matrix.coverage }}-cov/coverage/html/
          if-no-files-found: ignore

      # Build and test logs, plus datadirs of failed functional tests.
      - name: Upload logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.id }}
          path: |
            ${{ runner.temp }}/yacoin-build/*.log
            ${{ runner.temp }}/yacoin-build/build-*/*.log
            ${{ runner.temp }}/yacoin-build/build-*/coverage/lcov.log
            ${{ runner.temp }}/yacoin-build/build-*/functional-tmp/
          if-no-files-found: ignore

  coverage-report:
    name: coverage report (merged)
    needs: [changes, test]
    # Only where the coverage jobs ran; also after a failed test job.
    if: ${{ !cancelled() && needs.changes.outputs.tests == 'true' && needs.changes.outputs.coverage == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pull build image
        run: |
          for i in 1 2 3 4; do
            docker pull -q "$YACOIN_BUILD_IMAGE" && exit 0
            echo "pull failed (attempt $i), retrying in $((i * 30)) s"
            sleep $((i * 30))
          done
          exit 1

      - uses: actions/download-artifact@v4
        with:
          name: coverage-mainnet
          path: ${{ runner.temp }}/yacoin-build/build-mainnet-cov/coverage

      - uses: actions/download-artifact@v4
        with:
          name: coverage-lowdiff
          path: ${{ runner.temp }}/yacoin-build/build-lowdiff-cov/coverage

      - name: Test the coverage gate script
        run: python3 contrib/testing/test_coverage_gate.py

      # Merges both configurations and runs the coverage gate (P0-04,
      # contrib/testing/coverage-gates.toml); fails the job when a gate
      # is below its minimum, after writing the report and the summary.
      - name: Merge coverage and check the gate
        run: |
          rc=0
          contrib/testing/build.sh --coverage-report --work-dir "$RUNNER_TEMP/yacoin-build" | tee "$RUNNER_TEMP/report.txt" || rc=$?
          gate="$RUNNER_TEMP/yacoin-build/coverage-report/gate.txt"
          {
            echo "### Coverage (lcov)"; echo '```'
            sed -n '/^mainnet:/,/^== .* coverage gate:/p' "$RUNNER_TEMP/report.txt" | grep -v '^== ' || true
            echo '```'
            echo "### Coverage gate"; echo '```'
            if [ -f "$gate" ]; then grep -v '^  exclude ' "$gate"; else echo "(no gate output)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-merged
          path: |
            ${{ runner.temp }}/yacoin-build/coverage-report/merged.info
            ${{ runner.temp }}/yacoin-build/coverage-report/summary.txt
            ${{ runner.temp }}/yacoin-build/coverage-report/gate.txt
            ${{ runner.temp }}/yacoin-build/coverage-report/html/
          if-no-files-found: error
