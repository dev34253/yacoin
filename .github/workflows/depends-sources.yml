name: Depends sources

# Every depends source file can still be downloaded: from its recipe's host
# or else from the project mirror (FALLBACK_DOWNLOAD_PATH), and the mirror
# holds every file. Weekly, because hosts disappear without a change here.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'depends/**'
      - 'ci/depends-sources.sh'
      - '.github/workflows/depends-sources.yml'
  pull_request:
    paths:
      - 'depends/**'
      - 'ci/depends-sources.sh'
      - '.github/workflows/depends-sources.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: check the depends sources
        # Plain http:// recipes and a missing or different mirror file fail
        # the job; a recipe host that no longer serves its file is a warning.
        run: ci/depends-sources.sh
