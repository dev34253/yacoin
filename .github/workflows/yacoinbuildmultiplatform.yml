name: Yacoin multi platform build

# Pull requests run on every commit. Pushes run only on master, scratch/
# branches and tags: a branch with a pull request runs through it, and a
# scratch/ branch checks CI without one.
on:
  push:
    branches: [master, 'scratch/**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to master, scratch/
# branches and tags each get their own group, so release builds are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-ubuntu-1604:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # logs in to ghcr.io; publishes the image on master
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image tag tests
        # How every job's image tag is computed (seconds, no Docker).
        run: ci/containers/test-image-tag.sh
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
          registry-login: 'true'
          # Only master publishes; branches and pull requests build what
          # the registry lacks and keep it local.
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: cache dir and keys
        # Two cache entries: the depends packages and sources, keyed
        # release-depends-<image tag>-<depends hash>, and the ccache, keyed
        # release-ccache-<image tag>-<commit>. A push to master saves each
        # entry whose key is missing, and prune-caches deletes the superseded
        # ones. The build jobs (build-ubuntu-1604,
        # build-ubuntu-1604-low-difficulty, build-ubuntu-2204, build-windows,
        # build-macos) start without a cache on a push to master, where their
        # restores only look up the keys (lookup-only), and on a tag push,
        # where the restores are skipped; other runs restore the depends entry
        # by its key and the newest ccache entry by the key's prefix.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=release-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          echo "KEY_CCACHE_PREFIX=release-ccache-$image_key-" >> "$GITHUB_ENV"
          echo "KEY_CCACHE=release-ccache-$image_key-$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ${{ env.REL_CACHE }}/${{ env.IMAGE }}/depends-built
            ${{ env.REL_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
          lookup-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: actions/cache/restore@v5
        id: ccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: ${{ env.REL_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ env.KEY_CCACHE }}
          restore-keys: ${{ env.KEY_CCACHE_PREFIX }}
          lookup-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: build
        # Below the job timeout. Builds with the depends packages and the
        # ccache restored above (the entrypoint keeps both in /cache);
        # on a push to master and on a tag push the cache starts empty.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name release-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=250M \
            -e BUILDVERSION="$GITHUB_RUN_NUMBER" "$IMAGE_TAG"
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f release-build 2>/dev/null || true
          if [ -d "$REL_CACHE" ]; then sudo chown -R "$(id -u):$(id -g)" "$REL_CACHE"; fi
      - uses: actions/cache/save@v5
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.depends.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ env.REL_CACHE }}/${{ env.IMAGE }}/depends-built
            ${{ env.REL_CACHE }}/depends-sources
          key: ${{ steps.depends.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.REL_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        with:
          name: yacoind-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-qt-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-cli-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoin-cli
          if-no-files-found: error
  functional-tests:
    # Mainnet consensus build of yacoind and yacoin-cli, then the functional
    # test scripts, the three extended ones too, 4 at a time, one per vCPU of
    # the runner, on regtest, but those listed in
    # test/functional/regtest-excluded-scripts, which run in the
    # build-ubuntu-1604-low-difficulty job (functional-tests mode of the
    # yacoin-build image, Python 3.10). Cached and saved like the unit-tests
    # job, under its own keys.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and keys
        # Cache keys as in build-ubuntu-1604, keyed
        # functional-tests-depends-<image tag>-<depends hash> and
        # functional-tests-ccache-<image tag>-<commit>.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "FUNC_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          echo "KEY_CCACHE_PREFIX=functional-tests-ccache-$image_key-" >> "$GITHUB_ENV"
          echo "KEY_CCACHE=functional-tests-ccache-$image_key-$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.FUNC_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.FUNC_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - uses: actions/cache/restore@v5
        id: ccache
        with:
          path: ${{ env.FUNC_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ env.KEY_CCACHE }}
          restore-keys: ${{ env.KEY_CCACHE_PREFIX }}
      - name: build and run the functional tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 25
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$FUNC_CACHE"
          docker run --rm --init --name functional-tests -v "$GITHUB_WORKSPACE":/src -v "$FUNC_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=1G \
            "$IMAGE_TAG" functional-tests
      - name: stop the container and make the cache and logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f functional-tests 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          sudo chown -R "$(id -u):$(id -g)" "$FUNC_CACHE"
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/cache/save@v5
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.depends.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ env.FUNC_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.FUNC_CACHE }}/depends-sources
          key: ${{ steps.depends.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.FUNC_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: functional-test-logs
          path: |
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/*.log
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/std*/*
            build/docker-*/functional-tests/config.log
          retention-days: 14
  functional-tests-asan:
    # The functional-tests job's scripts under AddressSanitizer,
    # LeakSanitizer and UBSan (functional-tests-asan mode of the yacoin-build
    # image: the flags and options of unit-tests-asan on the mainnet
    # consensus build), but those listed in
    # test/sanitizer_suppressions/asan-excluded-scripts. Every process a
    # script starts writes its reports to a file named after the script; any
    # report that is not suppressed fails its script and the leg, and the
    # reports are printed at the end of the log.
    # Each leg builds yacoind and yacoin-cli and runs one shard of the
    # scripts (FTEST_SHARD=<leg>/<number of legs>, test_runner.py --shard:
    # by each script's position in the runner's list), so together the legs
    # run every script once; a new script lands in a shard by itself.
    # Cache as in unit-tests-asan: the functional-tests job's depends entry,
    # restored only; ccache is off.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        # The functional-tests job's depends entry, restored only.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "ASAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.ASAN_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.ASAN_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - name: build and run the functional tests under the sanitizers
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          FTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          mkdir -p "$ASAN_CACHE"
          docker run --rm --init --name functional-tests-asan -v "$GITHUB_WORKSPACE":/src -v "$ASAN_CACHE":/cache \
            -e FTEST_SHARD -e CCACHE_DISABLE=1 "$IMAGE_TAG" functional-tests-asan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f functional-tests-asan 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: functional-test-logs-asan-${{ matrix.shard }}
          path: |
            build/docker-*/functional-tests-asan/sanitizer-logs/
            build/docker-*/functional-tests-asan/test/tmp/test_runner_*/**/*.log
            build/docker-*/functional-tests-asan/test/tmp/test_runner_*/**/std*/*
            build/docker-*/functional-tests-asan/config.log
          retention-days: 14
  unit-tests:
    # Mainnet consensus build of test_bitcoin and bench_yacoin, every unit
    # test suite in parallel, then every benchmark once in a short mode
    # (unit-tests mode of the yacoin-build image). Depends packages,
    # depends sources and ccache are kept in /cache between runs, in a
    # depends entry and a ccache entry; only master pushes save them, so PR
    # runs can't evict them.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and keys
        # Cache keys as in build-ubuntu-1604, keyed
        # unit-tests-depends-<image tag>-<depends hash> and
        # unit-tests-ccache-<image tag>-<commit>.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "UNIT_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=unit-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          echo "KEY_CCACHE_PREFIX=unit-tests-ccache-$image_key-" >> "$GITHUB_ENV"
          echo "KEY_CCACHE=unit-tests-ccache-$image_key-$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.UNIT_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.UNIT_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - uses: actions/cache/restore@v5
        id: ccache
        with:
          path: ${{ env.UNIT_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ env.KEY_CCACHE }}
          restore-keys: ${{ env.KEY_CCACHE_PREFIX }}
      - name: build and run the unit tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$UNIT_CACHE"
          docker run --rm --init --name unit-tests -v "$GITHUB_WORKSPACE":/src -v "$UNIT_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=1G \
            "$IMAGE_TAG" unit-tests
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$UNIT_CACHE"
      - uses: actions/cache/save@v5
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.depends.outputs.cache-hit != 'true' }}
        with:
          path: |
            ${{ env.UNIT_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.UNIT_CACHE }}/depends-sources
          key: ${{ steps.depends.outputs.cache-primary-key }}
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.ccache.outputs.cache-hit != 'true' }}
        with:
          path: ${{ env.UNIT_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs
          path: |
            build/docker-*/unit-tests/unit-test-logs/
            build/docker-*/unit-tests/config.log
          retention-days: 14
  unit-tests-asan:
    # Every unit test suite under AddressSanitizer with LeakSanitizer and
    # under UBSan (unit-tests-asan mode of the yacoin-build image: the
    # sanitizer flags of dev.sh's asan variant with -g1, the suppressions in
    # test/sanitizer_suppressions/), one sanitizer per leg (SANITIZE): each
    # leg builds test_bitcoin with its sanitizer only and runs every suite.
    # Both legs read the same left-out lists. Any report that is not
    # suppressed fails its suite and the leg. Cache as in
    # coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitize: [address, undefined]
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        # The functional-tests job's depends entry, restored only.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "ASAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.ASAN_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.ASAN_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - name: build and run the unit tests under the sanitizers
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          mkdir -p "$ASAN_CACHE"
          docker run --rm --init --name unit-tests-asan -v "$GITHUB_WORKSPACE":/src -v "$ASAN_CACHE":/cache \
            -e SANITIZE -e CCACHE_DISABLE=1 "$IMAGE_TAG" unit-tests-asan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests-asan 2>/dev/null || true
          # The unit test logs, written by root with umask 077.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs-asan-${{ matrix.sanitize }}
          path: |
            build/docker-*/unit-tests-asan/unit-test-logs/
            build/docker-*/unit-tests-asan/config.log
          retention-days: 14
  unit-tests-tsan:
    # Every unit test suite under ThreadSanitizer (unit-tests-tsan mode of the
    # yacoin-build image, the suppressions in test/sanitizer_suppressions/);
    # any report that is not suppressed fails its suite and the job. The mode
    # turns address randomisation off for the suites, which Docker's default
    # seccomp filter refuses, so this container runs without it. Cache as in
    # coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        # The functional-tests job's depends entry, restored only.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "TSAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.TSAN_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.TSAN_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - name: build and run the unit tests under ThreadSanitizer
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$TSAN_CACHE"
          docker run --rm --init --name unit-tests-tsan -v "$GITHUB_WORKSPACE":/src -v "$TSAN_CACHE":/cache \
            --security-opt seccomp=unconfined -e CCACHE_DISABLE=1 "$IMAGE_TAG" unit-tests-tsan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests-tsan 2>/dev/null || true
          # The unit test logs, written by root with umask 077.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs-tsan
          path: |
            build/docker-*/unit-tests-tsan/unit-test-logs/
            build/docker-*/unit-tests-tsan/config.log
          retention-days: 14
  fuzz-corpus:
    # Every input of the fuzz corpus (test/fuzz/corpus/<target>/) once
    # through its fuzz target: the libFuzzer binary built with clang under
    # AddressSanitizer, LeakSanitizer and UBSan (fuzz-corpus mode of the
    # yacoin-build image, contrib/devtools/run-fuzz-corpus.py). It replays the
    # committed inputs only and never fuzzes; any report fails the job. Cache
    # as in coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        # The functional-tests job's depends entry, restored only.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "FUZZ_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.FUZZ_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.FUZZ_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - name: build the fuzz binary and replay the corpus
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$FUZZ_CACHE"
          docker run --rm --init --name fuzz-corpus -v "$GITHUB_WORKSPACE":/src -v "$FUZZ_CACHE":/cache \
            -e CCACHE_DISABLE=1 "$IMAGE_TAG" fuzz-corpus
      - name: stop the container and make the logs readable
        if: always()
        run: |
