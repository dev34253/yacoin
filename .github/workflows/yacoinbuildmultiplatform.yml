    # release job's (same depends packages), its ccache entry its own.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and keys
        # Cache entries as in build-ubuntu-1604: the depends entry is that
        # job's, the ccache entry low-difficulty-ccache-<image tag>-<commit>.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=release-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          echo "KEY_CCACHE_PREFIX=low-difficulty-ccache-$image_key-" >> "$GITHUB_ENV"
          echo "KEY_CCACHE=low-difficulty-ccache-$image_key-$GITHUB_SHA" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: |
            ${{ env.REL_CACHE }}/${{ env.IMAGE }}/depends-built
            ${{ env.REL_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
          lookup-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - uses: actions/cache/restore@v5
        id: ccache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          path: ${{ env.REL_CACHE }}/${{ env.IMAGE }}/ccache
          key: ${{ env.KEY_CCACHE }}
          restore-keys: ${{ env.KEY_CCACHE_PREFIX }}
          lookup-only: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: build
        # Below the job timeout. Builds with the depends packages and the
        # ccache restored above (the entrypoint keeps both in /cache);
        # on a push to master and on a tag push the cache starts empty.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name low-difficulty-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=250M \
            -e BUILDVERSION="$GITHUB_RUN_NUMBER" "$IMAGE_TAG" build-low-difficulty
      - name: stop the container and make the cache readable for saving and the test logs for uploading
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f low-difficulty-build 2>/dev/null || true
          if [ -d "$REL_CACHE" ]; then sudo chown -R "$(id -u):$(id -g)" "$REL_CACHE"; fi
