name: Yacoin multi platform build

# Pull requests run on every commit. Pushes run only on master, scratch/
# branches and tags: a branch with a pull request runs through it, and a
# scratch/ branch checks CI without one.
on:
  push:
    branches: [master, 'scratch/**']
    tags: ['**']
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's older run. Pushes to master, scratch/
# branches and tags each get their own group, so release builds are never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-ubuntu-1604:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # logs in to ghcr.io; publishes the image on master
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image tag tests
        # How every job's image tag is computed (seconds, no Docker).
        run: ci/containers/test-image-tag.sh
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
          registry-login: 'true'
          # Only master publishes; branches and pull requests build what
          # the registry lacks and keep it local.
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      - name: cache dir and key
        run: |
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=release-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          # Pushes to master and release tags build from scratch; only master
          # saves the cache. Branches and PRs reuse it.
          clean=false; save=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/master) clean=true; save=true ;;
              refs/tags/*) clean=true ;;
            esac
          fi
          echo "CLEAN_BUILD=$clean" >> "$GITHUB_ENV"
          echo "SAVE_CACHE=$save" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: env.CLEAN_BUILD != 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            release-${{ env.IMAGE }}-
      - name: build
        # Below the job timeout. Pushes to master and tags build from scratch
        # (nothing restored); other runs reuse the cached depends packages and
        # the ccache of the last master build (the entrypoint keeps both in
        # /cache).
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name release-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=1G \
            -e BUILDVERSION="$GITHUB_RUN_NUMBER" "$IMAGE_TAG"
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f release-build 2>/dev/null || true
          if [ -d "$REL_CACHE" ]; then sudo chown -R "$(id -u):$(id -g)" "$REL_CACHE"; fi
      - uses: actions/cache/save@v5
        if: success() && env.SAVE_CACHE == 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        with:
          name: yacoind-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoind
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-qt-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoin-qt
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: yacoin-cli-ubuntu-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoin-cli
          if-no-files-found: error
  functional-tests:
    # Low-difficulty build of yacoind and yacoin-cli, then every functional
    # test script, the three extended ones too, 4 at a time, one per vCPU of
    # the runner (functional-tests mode of the yacoin-build image, Python
    # 3.10). Cached and saved like the unit-tests job, in its own namespace.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "FUNC_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.FUNC_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and run the functional tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 25
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$FUNC_CACHE"
          docker run --rm --init --name functional-tests -v "$GITHUB_WORKSPACE":/src -v "$FUNC_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=2G \
            "$IMAGE_TAG" functional-tests
      - name: stop the container and make the cache and logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f functional-tests 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          sudo chown -R "$(id -u):$(id -g)" "$FUNC_CACHE"
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: ${{ env.FUNC_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: functional-test-logs
          path: |
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/*.log
            build/docker-*/functional-tests/test/tmp/test_runner_*/**/std*/*
            build/docker-*/functional-tests/config.log
          retention-days: 14
  functional-tests-asan:
    # The functional-tests job's scripts under AddressSanitizer,
    # LeakSanitizer and UBSan (functional-tests-asan mode of the yacoin-build
    # image: the flags and options of unit-tests-asan on the low-difficulty
    # build), but those listed in
    # test/sanitizer_suppressions/asan-excluded-scripts. Every process a
    # script starts writes its reports to a file named after the script; any
    # report that is not suppressed fails its script and the leg, and the
    # reports are printed at the end of the log.
    # Each leg builds yacoind and yacoin-cli and runs one shard of the
    # scripts (FTEST_SHARD=<leg>/<number of legs>, test_runner.py --shard:
    # by each script's position in the runner's list), so together the legs
    # run every script once; a new script lands in a shard by itself.
    # Cache as in unit-tests-asan: the functional-tests job's, restored only,
    # for the depends packages; ccache is off.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "ASAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.ASAN_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and run the functional tests under the sanitizers
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          FTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          mkdir -p "$ASAN_CACHE"
          docker run --rm --init --name functional-tests-asan -v "$GITHUB_WORKSPACE":/src -v "$ASAN_CACHE":/cache \
            -e FTEST_SHARD -e CCACHE_DISABLE=1 "$IMAGE_TAG" functional-tests-asan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f functional-tests-asan 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: functional-test-logs-asan-${{ matrix.shard }}
          path: |
            build/docker-*/functional-tests-asan/sanitizer-logs/
            build/docker-*/functional-tests-asan/test/tmp/test_runner_*/**/*.log
            build/docker-*/functional-tests-asan/test/tmp/test_runner_*/**/std*/*
            build/docker-*/functional-tests-asan/config.log
          retention-days: 14
  unit-tests:
    # Mainnet consensus build of test_bitcoin and bench_yacoin, every unit
    # test suite in parallel, then every benchmark once in a short mode
    # (unit-tests mode of the yacoin-build image). Depends packages,
    # depends sources and ccache are kept in /cache between runs; only master
    # pushes save that cache, so PR runs can't evict it.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "UNIT_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=unit-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            unit-tests-${{ env.IMAGE }}-
      - name: build and run the unit tests
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$UNIT_CACHE"
          docker run --rm --init --name unit-tests -v "$GITHUB_WORKSPACE":/src -v "$UNIT_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=2G \
            "$IMAGE_TAG" unit-tests
      - name: stop the container and make the cache readable for saving
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests 2>/dev/null || true
          sudo chown -R "$(id -u):$(id -g)" "$UNIT_CACHE"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        with:
          path: ${{ env.UNIT_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs
          path: |
            build/docker-*/unit-tests/unit-test-logs/
            build/docker-*/unit-tests/config.log
          retention-days: 14
  unit-tests-asan:
    # Every unit test suite under AddressSanitizer with LeakSanitizer and
    # under UBSan (unit-tests-asan mode of the yacoin-build image: the
    # sanitizer flags of dev.sh's asan variant with -g1, the suppressions in
    # test/sanitizer_suppressions/), one sanitizer per leg (SANITIZE): each
    # leg builds test_bitcoin with its sanitizer only and runs every suite.
    # Both legs read the same left-out lists. Any report that is not
    # suppressed fails its suite and the leg. Cache as in
    # coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitize: [address, undefined]
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "ASAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.ASAN_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and run the unit tests under the sanitizers
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          mkdir -p "$ASAN_CACHE"
          docker run --rm --init --name unit-tests-asan -v "$GITHUB_WORKSPACE":/src -v "$ASAN_CACHE":/cache \
            -e SANITIZE -e CCACHE_DISABLE=1 "$IMAGE_TAG" unit-tests-asan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests-asan 2>/dev/null || true
          # The unit test logs, written by root with umask 077.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs-asan-${{ matrix.sanitize }}
          path: |
            build/docker-*/unit-tests-asan/unit-test-logs/
            build/docker-*/unit-tests-asan/config.log
          retention-days: 14
  unit-tests-tsan:
    # Every unit test suite under ThreadSanitizer (unit-tests-tsan mode of the
    # yacoin-build image, the suppressions in test/sanitizer_suppressions/);
    # any report that is not suppressed fails its suite and the job. The mode
    # turns address randomisation off for the suites, which Docker's default
    # seccomp filter refuses, so this container runs without it. Cache as in
    # coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "TSAN_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.TSAN_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and run the unit tests under ThreadSanitizer
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$TSAN_CACHE"
          docker run --rm --init --name unit-tests-tsan -v "$GITHUB_WORKSPACE":/src -v "$TSAN_CACHE":/cache \
            --security-opt seccomp=unconfined -e CCACHE_DISABLE=1 "$IMAGE_TAG" unit-tests-tsan
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f unit-tests-tsan 2>/dev/null || true
          # The unit test logs, written by root with umask 077.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs-tsan
          path: |
            build/docker-*/unit-tests-tsan/unit-test-logs/
            build/docker-*/unit-tests-tsan/config.log
          retention-days: 14
  fuzz-corpus:
    # Every input of the fuzz corpus (test/fuzz/corpus/<target>/) once
    # through its fuzz target: the libFuzzer binary built with clang under
    # AddressSanitizer, LeakSanitizer and UBSan (fuzz-corpus mode of the
    # yacoin-build image, contrib/devtools/run-fuzz-corpus.py). It replays the
    # committed inputs only and never fuzzes; any report fails the job. Cache
    # as in coverage-unit: the functional-tests job's, restored only, for the
    # depends packages; ccache is off, since sanitizer objects never hit the
    # cached ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "FUZZ_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.FUZZ_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build the fuzz binary and replay the corpus
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$FUZZ_CACHE"
          docker run --rm --init --name fuzz-corpus -v "$GITHUB_WORKSPACE":/src -v "$FUZZ_CACHE":/cache \
            -e CCACHE_DISABLE=1 "$IMAGE_TAG" fuzz-corpus
      - name: stop the container and make the logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f fuzz-corpus 2>/dev/null || true
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: fuzz-corpus-logs
          path: |
            build/docker-*/fuzz-corpus/fuzz-corpus-logs/
            build/docker-*/fuzz-corpus/config.log
          retention-days: 14
  build-ubuntu-1604-low-difficulty:
    # The 16.04 release build (depends, glibc back-compat, static libstdc++,
    # so the binary runs on Ubuntu 16.04 and later) with
    # --enable-low-difficulty-for-development, which relaxes the mainnet
    # proof-of-work limits for miner end-to-end tests: the
    # build-low-difficulty mode of the image, which then runs all unit test
    # suites of that build, so a test that only passes with the mainnet
    # parameters fails here (the unit-tests job runs them on the mainnet
    # build). Cached and saved like the release jobs, under its own key;
    # without a cache of its own it starts from the 16.04 release job's
    # (same depends packages).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.16.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "REL_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=low-difficulty-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
          # Pushes to master and release tags build from scratch; only master
          # saves the cache. Branches and PRs reuse it.
          clean=false; save=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF" in
              refs/heads/master) clean=true; save=true ;;
              refs/tags/*) clean=true ;;
            esac
          fi
          echo "CLEAN_BUILD=$clean" >> "$GITHUB_ENV"
          echo "SAVE_CACHE=$save" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        if: env.CLEAN_BUILD != 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            low-difficulty-${{ env.IMAGE }}-
            release-${{ env.IMAGE }}-
      - name: build
        # Below the job timeout. Pushes to master and tags build from scratch
        # (nothing restored); other runs reuse the cached depends packages and
        # the ccache of the last master build (the entrypoint keeps both in
        # /cache).
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$REL_CACHE"
          docker run --rm --init --name low-difficulty-build -v "$GITHUB_WORKSPACE":/src -v "$REL_CACHE":/cache \
            -e CCACHE_COMPRESS=1 -e CCACHE_MAXSIZE=1G \
            -e BUILDVERSION="$GITHUB_RUN_NUMBER" "$IMAGE_TAG" build-low-difficulty
      - name: stop the container and make the cache readable for saving and the unit test logs for uploading
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f low-difficulty-build 2>/dev/null || true
          if [ -d "$REL_CACHE" ]; then sudo chown -R "$(id -u):$(id -g)" "$REL_CACHE"; fi
          # The unit test logs, written by root with umask 077.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/cache/save@v5
        if: success() && env.SAVE_CACHE == 'true'
        with:
          path: ${{ env.REL_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: unit-test-logs-low-difficulty
          path: build/docker-*/build-low-difficulty/unit-test-logs/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: yacoind-low-difficulty-16.04
          path: ${{ github.workspace }}/release-root/bin/yacoind
          if-no-files-found: error
  build-ubuntu-2204:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # logs in to ghcr.io; publishes the image on master
    timeout-minutes: 60
