  coverage-unit:
    # Unit test coverage: mainnet coverage build (--enable-lcov, -O0) and
    # "make cov-unit" (cov-unit mode of the yacoin-build image). Restores the
    # functional-tests job's cache for its depends packages (same image, same
    # no-Qt packages and prefix) and never saves a cache of its own; ccache is
    # off, since -O0 objects never hit the cached -O1 ones. The coverage
    # artifact is named per run attempt and its name and id are job outputs,
    # so coverage-report takes the upload of the attempt that ran this job.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
      COVERAGE_ARTIFACT: coverage-unit-${{ github.run_attempt }}
    outputs:
      artifact-name: ${{ env.COVERAGE_ARTIFACT }}
      artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        run: |
          echo "COV_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "CACHE_KEY=functional-tests-$IMAGE-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        with:
          path: ${{ env.COV_CACHE }}
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.CACHE_KEY }}-
            functional-tests-${{ env.IMAGE }}-
      - name: build and measure the unit test coverage
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$COV_CACHE"
          docker run --rm --init --name coverage-unit -v "$GITHUB_WORKSPACE":/src -v "$COV_CACHE":/cache \
            -e CCACHE_DISABLE=1 "$IMAGE_TAG" cov-unit
      - name: stop the container and make the build readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f coverage-unit 2>/dev/null || true
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        id: upload-coverage
        # Also when the tests failed: the make targets capture coverage anyway.
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.COVERAGE_ARTIFACT }}
          path: |
            build/docker-${{ env.IMAGE }}/cov-unit/test_bitcoin_coverage.info
            build/docker-${{ env.IMAGE }}/cov-unit/test_bitcoin_functions.json
            build/docker-${{ env.IMAGE }}/cov-unit/test_bitcoin.coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: coverage-unit-logs
          path: |
            build/docker-*/cov-unit/*.log
            build/docker-*/cov-unit/test_bitcoin.logs/
            build/docker-*/cov-unit/config.log
          retention-days: 14
