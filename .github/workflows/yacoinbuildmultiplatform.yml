  coverage-report:
    # Merges the tracefiles of coverage-unit and of both coverage-functional
    # shards (lcov 2.6 of the 22.04 image,
    # with configure's LCOV_OPTS and the Makefile's GENHTML_OPTS), writes the
    # combined HTML report, and checks the files of
    # contrib/devtools/coverage-targets.json with coverage-check.py (after its
    # own tests). The table goes to the job summary; the job fails when the
    # check fails. Downloads the artifacts named in the coverage jobs'
    # outputs, which after a rerun are those of the attempt each job last ran
    # in, per job: a rerun of one shard is merged with the other shard's
    # earlier upload.
    needs: [coverage-unit, coverage-functional-1, coverage-functional-2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: coverage artifacts to merge
        env:
          UNIT_NAME: ${{ needs.coverage-unit.outputs.artifact-name }}
          UNIT_ID: ${{ needs.coverage-unit.outputs.artifact-id }}
          FUNCTIONAL_1_NAME: ${{ needs.coverage-functional-1.outputs.artifact-name }}
          FUNCTIONAL_1_ID: ${{ needs.coverage-functional-1.outputs.artifact-id }}
          FUNCTIONAL_2_NAME: ${{ needs.coverage-functional-2.outputs.artifact-name }}
          FUNCTIONAL_2_ID: ${{ needs.coverage-functional-2.outputs.artifact-id }}
        run: |
          echo "coverage-unit: artifact '$UNIT_NAME', id '$UNIT_ID'"
          echo "coverage-functional-1: artifact '$FUNCTIONAL_1_NAME', id '$FUNCTIONAL_1_ID'"
          echo "coverage-functional-2: artifact '$FUNCTIONAL_2_NAME', id '$FUNCTIONAL_2_ID'"
          # An empty id means the upload failed or found no files.
          for v in "$UNIT_NAME" "$UNIT_ID" "$FUNCTIONAL_1_NAME" "$FUNCTIONAL_1_ID" "$FUNCTIONAL_2_NAME" "$FUNCTIONAL_2_ID"; do
            if [ -z "$v" ]; then
              echo "::error::A coverage job uploaded no coverage artifact; nothing to merge."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-unit.outputs.artifact-name }}
          path: coverage/unit
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-functional-1.outputs.artifact-name }}
          path: coverage/functional-1
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-functional-2.outputs.artifact-name }}
          path: coverage/functional-2
      - name: merge, report and check
        timeout-minutes: 15
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          status=0
          docker run --rm --init --name coverage-report -v "$GITHUB_WORKSPACE":/src -w /src --entrypoint bash "$IMAGE_TAG" -c '
            set -euo pipefail
            python3 -I -B -m unittest discover -s contrib/devtools/test
            # LCOV_OPTS of configure.ac and GENHTML_OPTS of Makefile.am; keep them in step.
            lcov_opts=(--config-file /src/contrib/devtools/coverage-lcovrc)
            lcov "${lcov_opts[@]}" -q -a coverage/unit/test_bitcoin_coverage.info \
              -a coverage/functional-1/functional_test_coverage.info \
              -a coverage/functional-2/functional_test_coverage.info -o coverage/total.info
            genhtml "${lcov_opts[@]}" --demangle-cpp -s -q coverage/total.info -o coverage/total
            python3 -I -B contrib/devtools/coverage-check.py --root /src \
              --unit coverage/unit/test_bitcoin_coverage.info --all coverage/total.info \
              --functions coverage/unit/test_bitcoin_functions.json \
                coverage/functional-1/functional_test_functions.json coverage/functional-2/functional_test_functions.json \
              --markdown coverage/summary.md' || status=$?
          if [ -f coverage/summary.md ]; then cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: make the reports readable
        if: always()
        run: |
          docker rm -f coverage-report 2>/dev/null || true
          if [ -d coverage ]; then sudo chown -R "$(id -u):$(id -g)" coverage; fi
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-combined
          path: |
            coverage/total.info
