          # A step timeout may kill docker run without stopping the container.
          docker rm -f coverage-functional 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        id: upload-coverage
        # Also when the tests failed: the make targets capture coverage anyway.
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.COVERAGE_ARTIFACT }}
          path: |
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test_coverage.info
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test_functions.json
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test.coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: coverage-functional-1-logs
          path: |
            build/docker-*/cov-functional/*.log
            build/docker-*/cov-functional/test/tmp/test_runner_*/**/*.log
            build/docker-*/cov-functional/test/tmp/test_runner_*/**/std*/*
          retention-days: 14
  coverage-functional-2:
    # Functional test coverage, shard 2 of 2: a coverage build of its own,
    # configured as coverage-unit's, and "make cov-functional" with
    # FTEST_SHARD=2/2 (cov-functional mode of the yacoin-build image; the
    # shard's scripts run 4 in parallel, with make's FTEST_TIMEOUT_FACTOR
    # passed as --timeout-factor; test_runner.py --shard picks a script's
    # shard by its position in the runner's list). coverage-functional-1 runs
    # the other shard; written out twice, so that each job has outputs of its
    # own. Cache as in coverage-unit: the functional-tests job's, restored
    # only. Artifact name (per shard and attempt) and outputs as in
    # coverage-unit.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMAGE: ubuntu.22.04
      COVERAGE_ARTIFACT: coverage-functional-2-${{ github.run_attempt }}
      FTEST_SHARD: 2/2
    outputs:
      artifact-name: ${{ env.COVERAGE_ARTIFACT }}
      artifact-id: ${{ steps.upload-coverage.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: cache dir and key
        # The functional-tests job's depends entry, restored only.
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          image_key=${IMAGE_TAG##*:}
          echo "COV_CACHE=$RUNNER_TEMP/yacoin-cache" >> "$GITHUB_ENV"
          echo "KEY_DEPENDS=functional-tests-depends-$image_key-${{ hashFiles('depends/packages/*.mk', 'depends/patches/**', 'depends/Makefile', 'depends/funcs.mk', 'depends/hosts/*.mk', 'depends/builders/*.mk') }}" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v5
        id: depends
        with:
          path: |
            ${{ env.COV_CACHE }}/${{ env.IMAGE }}/depends-built-tests
            ${{ env.COV_CACHE }}/depends-sources
          key: ${{ env.KEY_DEPENDS }}
      - name: build and measure the functional test coverage
        # Below the job timeout, so a hang fails this step and the logs are
        # still uploaded.
        timeout-minutes: 50
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          mkdir -p "$COV_CACHE"
          docker run --rm --init --name coverage-functional -v "$GITHUB_WORKSPACE":/src -v "$COV_CACHE":/cache \
            -e FTEST_SHARD -e CCACHE_DISABLE=1 "$IMAGE_TAG" cov-functional
      - name: stop the container and make the build and logs readable
        if: always()
        run: |
          # A step timeout may kill docker run without stopping the container.
          docker rm -f coverage-functional 2>/dev/null || true
          # The nodes write their datadirs with umask 077 as root.
          if [ -d build ]; then sudo chown -R "$(id -u):$(id -g)" build; fi
      - uses: actions/upload-artifact@v6
        id: upload-coverage
        # Also when the tests failed: the make targets capture coverage anyway.
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.COVERAGE_ARTIFACT }}
          path: |
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test_coverage.info
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test_functions.json
            build/docker-${{ env.IMAGE }}/cov-functional/functional_test.coverage/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: coverage-functional-2-logs
          path: |
            build/docker-*/cov-functional/*.log
            build/docker-*/cov-functional/test/tmp/test_runner_*/**/*.log
            build/docker-*/cov-functional/test/tmp/test_runner_*/**/std*/*
          retention-days: 14
  coverage-report:
    # Merges the tracefiles of coverage-unit and of both coverage-functional
    # shards (lcov 2.6 of the 22.04 image,
    # with configure's LCOV_OPTS and the Makefile's GENHTML_OPTS), writes the
    # combined HTML report, and checks the files of
    # contrib/devtools/coverage-targets.json with coverage-check.py (after its
    # own tests). The table goes to the job summary; the job fails when the
    # check fails. Downloads the artifacts named in the coverage jobs'
    # outputs, which after a rerun are those of the attempt each job last ran
    # in, per job: a rerun of one shard is merged with the other shard's
    # earlier upload.
    needs: [coverage-unit, coverage-functional-1, coverage-functional-2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ubuntu.22.04
    steps:
      - uses: actions/checkout@v6
      - name: image
        id: image
        uses: ./.github/actions/yacoin-build-image
        with:
          image: ${{ env.IMAGE }}
      - name: coverage artifacts to merge
        env:
          UNIT_NAME: ${{ needs.coverage-unit.outputs.artifact-name }}
          UNIT_ID: ${{ needs.coverage-unit.outputs.artifact-id }}
          FUNCTIONAL_1_NAME: ${{ needs.coverage-functional-1.outputs.artifact-name }}
          FUNCTIONAL_1_ID: ${{ needs.coverage-functional-1.outputs.artifact-id }}
          FUNCTIONAL_2_NAME: ${{ needs.coverage-functional-2.outputs.artifact-name }}
          FUNCTIONAL_2_ID: ${{ needs.coverage-functional-2.outputs.artifact-id }}
        run: |
          echo "coverage-unit: artifact '$UNIT_NAME', id '$UNIT_ID'"
          echo "coverage-functional-1: artifact '$FUNCTIONAL_1_NAME', id '$FUNCTIONAL_1_ID'"
          echo "coverage-functional-2: artifact '$FUNCTIONAL_2_NAME', id '$FUNCTIONAL_2_ID'"
          # An empty id means the upload failed or found no files.
          for v in "$UNIT_NAME" "$UNIT_ID" "$FUNCTIONAL_1_NAME" "$FUNCTIONAL_1_ID" "$FUNCTIONAL_2_NAME" "$FUNCTIONAL_2_ID"; do
            if [ -z "$v" ]; then
              echo "::error::A coverage job uploaded no coverage artifact; nothing to merge."
              exit 1
            fi
          done
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-unit.outputs.artifact-name }}
          path: coverage/unit
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-functional-1.outputs.artifact-name }}
          path: coverage/functional-1
      - uses: actions/download-artifact@v7
        with:
          name: ${{ needs.coverage-functional-2.outputs.artifact-name }}
          path: coverage/functional-2
      - name: merge, report and check
        timeout-minutes: 15
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          status=0
          docker run --rm --init --name coverage-report -v "$GITHUB_WORKSPACE":/src -w /src --entrypoint bash "$IMAGE_TAG" -c '
            set -euo pipefail
            python3 -I -B -m unittest discover -s contrib/devtools/test
            # LCOV_OPTS of configure.ac and GENHTML_OPTS of Makefile.am; keep them in step.
            lcov_opts=(--config-file /src/contrib/devtools/coverage-lcovrc)
            lcov "${lcov_opts[@]}" -q -a coverage/unit/test_bitcoin_coverage.info \
              -a coverage/functional-1/functional_test_coverage.info \
              -a coverage/functional-2/functional_test_coverage.info -o coverage/total.info
            genhtml "${lcov_opts[@]}" --demangle-cpp -s -q coverage/total.info -o coverage/total
            python3 -I -B contrib/devtools/coverage-check.py --root /src \
              --unit coverage/unit/test_bitcoin_coverage.info --all coverage/total.info \
              --functions coverage/unit/test_bitcoin_functions.json \
                coverage/functional-1/functional_test_functions.json coverage/functional-2/functional_test_functions.json \
              --markdown coverage/summary.md' || status=$?
          if [ -f coverage/summary.md ]; then cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$status"
      - name: make the reports readable
        if: always()
        run: |
          docker rm -f coverage-report 2>/dev/null || true
          if [ -d coverage ]; then sudo chown -R "$(id -u):$(id -g)" coverage; fi
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-combined
          path: |
            coverage/total.info
            coverage/total/
          if-no-files-found: ignore
          retention-days: 14
  prune-caches:
    # After the jobs that save caches, on a push to master: of the cache
    # entries <kind>-depends-<image>-<tag hash>-<depends hash> and
    # <kind>-ccache-<image>-<tag hash>-<commit> of this branch, keeps the
    # newest (the highest cache id) per kind, image, type (depends or ccache)
    # and cache version and deletes the others. A group with more than one
    # cache version gets a warning. Builds nothing.
    needs: [build-ubuntu-1604, functional-tests, unit-tests, build-ubuntu-1604-low-difficulty, build-ubuntu-2204, build-windows, build-macos]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write  # deletes superseded cache entries
    timeout-minutes: 5
    steps:
      - name: delete superseded cache entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?ref=$GITHUB_REF&per_page=100" \
            --jq '.actions_caches[]' > caches.json
          groups='[.[] | select(.key | test("^.+-(depends|ccache)-[a-z0-9.]+-[0-9a-f]{12}-[0-9a-f]+$"))
                   | .group = (.key | capture("^(?<g>.+-(depends|ccache)-[a-z0-9.]+)-[0-9a-f]{12}-[0-9a-f]+$").g)]'
          jq -r -s "$groups"' | group_by(.group)[] | select([.[].version] | unique | length > 1)
                   | "::warning::cache entries of \(.[0].group) with more than one cache version: \([.[] | "\(.key) (\(.version))"] | join(", "))"' caches.json
          jq -r -s "$groups"' | group_by([.group, .version])[] | sort_by(.id) | .[:-1][]
                   | "\(.id)\t\(.key)"' caches.json > superseded.tsv
          while IFS=$'\t' read -r id key; do
            echo "deleting $key"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id" > /dev/null ||
              echo "::warning::could not delete $key (id $id)"
          done < superseded.tsv
          echo "$(wc -l < superseded.tsv) superseded cache entries"
