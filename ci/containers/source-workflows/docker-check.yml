name: Docker check

# Builds the Linux images on pull requests without logging in or pushing, so
# Dockerfile, entrypoint and publish-workflow changes are checked before
# dockerpush.yml publishes them on master.
on:
  pull_request:
    paths:
      - 'Dockerfile.ubuntu.*'
      - 'Dockerfile.windows'
      - 'Dockerfile.macos'
      - 'entrypoint.sh'
      - 'entrypoint.windows.sh'
      - 'entrypoint.macos.sh'
      - '.github/workflows/docker-check.yml'
      - '.github/workflows/dockerpush.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the entrypoints
        run: |
          for f in entrypoint.sh entrypoint.windows.sh entrypoint.macos.sh; do
            bash -n "$f"
            shellcheck --severity=warning "$f"
          done
      - name: Check the publish workflow
        run: |
          # Every image that is built must be pushed with the same tag.
          built=$(grep -o 'docker build .*--tag [^ ]*' .github/workflows/dockerpush.yml | sed 's/.*--tag //' | sort)
          pushed=$(grep -o 'docker push [^ ]*' .github/workflows/dockerpush.yml | sed 's/docker push //' | sort)
          diff <(echo "$built") <(echo "$pushed")

  build:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu.16.04, ubuntu.18.04, ubuntu.20.04, ubuntu.22.04, ubuntu.24.04-gcc11]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build . --file Dockerfile.${{ matrix.image }} --tag yacoin-build-check:${{ matrix.image }}
      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash yacoin-build-check:${{ matrix.image }} -c '
            set -e
            test "$YACOIN_BUILD_IMAGE" = "${{ matrix.image }}"
            bison --version | head -1
            bash -n /entrypoint.sh
            if [ "$YACOIN_BUILD_IMAGE" = ubuntu.22.04 ]; then lcov --version; fi'
          # An unknown mode must be rejected before anything is built.
          status=0
          docker run --rm yacoin-build-check:${{ matrix.image }} no-such-mode || status=$?
          test "$status" = 2
          # The test modes must stop early, with a clear message, on a tree
          # without the scripts and targets they need.
          mkdir -p fake-src
          printf 'all:\n' > fake-src/Makefile.am
          for mode in unit-tests cov-unit; do
            status=0
            docker run --rm -v "$PWD/fake-src:/src" yacoin-build-check:${{ matrix.image }} "$mode" \
              > out.txt 2>&1 || status=$?
            cat out.txt
            test "$status" = 1
            grep -q 'error: ' out.txt
          done

  # Builds yacoin master twice with each cross image and one cache dir, with a
  # clean tree in between: the second build must take every depends package
  # from the cache and get ccache hits.
  cross:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build . --file Dockerfile.${{ matrix.image }} --tag yacoin-build-check:${{ matrix.image }}
      - uses: actions/checkout@v4
        with:
          repository: yacoin/yacoin
          path: yacoin
      - name: First build (empty cache)
        shell: bash
        run: |
          df -h /
          mkdir -p "$RUNNER_TEMP/cache"
          docker run --rm -v "$PWD/yacoin:/src" -v "$RUNNER_TEMP/cache:/cache" \
            yacoin-build-check:${{ matrix.image }} 2>&1 | tee run1.log
      - name: Clean the tree
        run: |
          sudo chown -R "$(id -u):$(id -g)" yacoin "$RUNNER_TEMP/cache"
          git -C yacoin clean -xdfq
          test -z "$(git -C yacoin status --porcelain)"
      - name: Second build (warm cache)
        shell: bash
        run: |
          docker run --rm -v "$PWD/yacoin:/src" -v "$RUNNER_TEMP/cache:/cache" \
            yacoin-build-check:${{ matrix.image }} 2>&1 | tee run2.log
          df -h /
      - name: Check that the second build used the cache
        shell: bash
        run: |
          case "${{ matrix.image }}" in
            windows) bins="yacoind.exe yacoin-cli.exe yacoin-qt.exe" ;;
            macos) bins="yacoind yacoin-cli yacoin-qt" ;;
          esac
          for b in $bins; do test -s "yacoin/release-root/bin/$b"; done
          grep -q '^== Using cache in /cache/${{ matrix.image }} ==' run2.log
          # depends prints these only when it builds or downloads a package;
          # a run from the cache only copies the packages.
          if grep -E '^(Fetching|Extracting|Building) [A-Za-z0-9_+.-]+' run2.log; then
            echo "the second build rebuilt depends packages" >&2; exit 1
          fi
          grep -q '^copying packages:' run2.log
          if grep -q 'Checksum mismatch' run2.log; then
            echo "a cached depends package failed its checksum" >&2; exit 1
          fi
          # ccache prints running totals, so compare the two runs.
          hits() { awk '/^cache hit \((direct|preprocessed)\)/ {s += $NF} END {print s + 0}' "$1"; }
          misses() { awk '/^cache miss/ {s += $NF} END {print s + 0}' "$1"; }
          new_hits=$(( $(hits run2.log) - $(hits run1.log) ))
          new_misses=$(( $(misses run2.log) - $(misses run1.log) ))
          echo "second build: $new_hits ccache hits, $new_misses misses"
          # A few misses are expected (e.g. clientversion.cpp uses __DATE__).
          (( new_hits > 0 && new_hits * 10 >= (new_hits + new_misses) * 9 ))
