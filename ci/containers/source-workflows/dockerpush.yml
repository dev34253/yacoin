name: Docker

# Publish images only from master (pushes to other branches must not
# overwrite published tags). Can also be started manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PWD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
      - name: Build image for ubuntu 24.04 with GCC 11
        run: |
          docker build . --file Dockerfile.ubuntu.24.04-gcc11 --tag dev34253/yacoin-build:ubuntu.24.04-gcc11-2
          docker push dev34253/yacoin-build:ubuntu.24.04-gcc11-2
      - name: Build image for ubuntu 22.04
        run: |
          docker build . --file Dockerfile.ubuntu.22.04 --tag dev34253/yacoin-build:ubuntu.22.04-2
          docker push dev34253/yacoin-build:ubuntu.22.04-2
      - name: Build image for ubuntu 20.04
        run: |
          docker build . --file Dockerfile.ubuntu.20.04 --tag dev34253/yacoin-build:ubuntu.20.04-2
          docker push dev34253/yacoin-build:ubuntu.20.04-2
      - name: Build image for ubuntu 18.04
        run: |
          docker build . --file Dockerfile.ubuntu.18.04 --tag dev34253/yacoin-build:ubuntu.18.04-2
          docker push dev34253/yacoin-build:ubuntu.18.04-2
      - name: Build image for ubuntu 16.04
        run: |
          docker build . --file Dockerfile.ubuntu.16.04 --tag dev34253/yacoin-build:ubuntu.16.04-2
          docker push dev34253/yacoin-build:ubuntu.16.04-2
      - name: Build image for Windows
        run: |
          docker build . --file Dockerfile.windows --tag dev34253/yacoin-build:windows-2
          docker push dev34253/yacoin-build:windows-2
      - name: Build image for MacOS
        run: |
          docker build . --file Dockerfile.macos --tag dev34253/yacoin-build:macos-2
          docker push dev34253/yacoin-build:macos-2